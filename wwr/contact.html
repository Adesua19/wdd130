<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting Company for inquiries, reservations, and feedback. View our location, team members, and contact form.">
    <meta name="author" content="Effodu Leonie Adesua">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Centered Company Information Header -->
        <section class="company-header">
            <h1>White Water Rafting Company</h1>
            <address>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </address>
        </section>


        <section class="contact-main-grid">

            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d184764.21543881775!2d-113.9163235!3d45.1764121!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5357303f8a09b4d1%3A0x6a1c5d9fa7bf771b!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="White Water Rafting Location Map">
                </iframe>
            </div>


            <form action="#" method="post" class="contact-form">
                <div class="form-row">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-row radio-row">
                    <span class="label-title">Message Purpose</span>
                    <div class="radio-options">
                        <label><input type="radio" name="purpose" value="general" checked> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here..."
                      required></textarea>
                </div>

                <div class="form-row checkbox-row">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>


        <section class="team-container">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.png" alt="Employee Profile 1">
                    <figcaption>
                        <h3>Brooke B</h3>
                        <p>General Manager</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.png" alt="Employee Profile 2">
                    <figcaption>
                        <h3>Ryan H</h3>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.png" alt="Employee Profile 3">
                    <figcaption>
                        <h3>Vitaly G</h3>
                        <p>Safety Coordinator</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 2026 White Water Rafting | Effodu Leonie Adesua</p>
        <div class="social-links">
            <a href="http://facebook.com" target="_blank">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </div>
    </footer>
</body>

</html>
