<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Get in touch with White Water Rafting Company. Send us your questions, feedback, or book custom group river adventures today.">
    <meta name="author" content="Effodu Leonie Adesua">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="company-header">
            <h1>Contact Us</h1>
            <address>
                White Water Rafting Co.<br>
                123 River Run Road, Canyon City<br>
                Phone: (555) 123-4567<br>
                Email: <a href="mailto:info@whitewaterrafting.com">info@whitewaterrafting.com</a>
            </address>
        </div>


        <div class="contact-main-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.95373631531584!3d-37.81627974202166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf577ddef302m!2sFlinders+St%2C+Melbourne+VIC+3000+Australia!5e0!3m2!1sen!2sus!4v1630000000000!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname"
                      placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <label for="emailaddress">Email:</label>
                    <input type="email" id="emailaddress" name="emailaddress"
                      placeholder="Enter your email address" required>
                </div>

                <div class="form-row radio-row">
                    <span class="label-title">Purpose:</span>
                    <div class="radio-options">
                        <label><input type="radio" name="inquiry-purpose" value="general" checked>
                            General Inquiry</label>
                        <label><input type="radio" name="inquiry-purpose" value="reservation">
                            Reservation Question</label>
                        <label><input type="radio" name="inquiry-purpose" value="suggestion">
                            Website Suggestion</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type your message here..." required></textarea>
                </div>

                <div class="form-row checkbox-row">
                    <label>
                        <input type="checkbox" name="newsletter-sub" value="yes"> Please subscribe
                        me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <div class="team-container">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.png" alt="Sarah Jenkins, Lead River Guide">
                    <figcaption>
                        <h3>Sarah Jenkins</h3>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.png" alt="Marcus Vance, Safety Coordinator">
                    <figcaption>
                        <h3>Marcus Vance</h3>
                        <p>Safety Coordinator</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.png" alt="Elena Rostova, Customer Relations">
                    <figcaption>
                        <h3>Elena Rostova</h3>
                        <p>Customer Relations</p>
                    </figcaption>
                </figure>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Effodu Leonie Adesua</p>
        <ul class="socialmedia">
            <li><a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                      alt="Facebook Icon"></a></li>
            <li><a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                      alt="Twitter Icon"></a></li>
            <li><a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                      alt="Instagram Icon"></a></li>
        </ul>
    </footer>
</body>

</html>
